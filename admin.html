<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>بەڕێوەبردن — ڕێبەری پەروەردەی شارباژێڕ</title>
<style>
:root{--bg:#0e1626;--card:#16223a;--ink:#f1f5ff;--mut:#9aabc8;--line:#2f4166;--blue:#4f9bff;--red:#ff6b7a;--green:#4cd27a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,system-ui,sans-serif;line-height:1.7;padding:14px}
.box{max-width:820px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
h1{font-size:1.3rem;margin:0 0 6px}h2{font-size:1.1rem;margin:14px 0 8px;color:var(--blue)}
p.mut{color:var(--mut);margin:4px 0 12px;font-size:.92rem}
input,select,textarea,button{font:inherit;border-radius:12px;border:1px solid var(--line);background:#0e1626;color:var(--ink);padding:10px 12px;width:100%;margin:4px 0 10px}
textarea{min-height:90px;resize:vertical}
button{background:var(--blue);color:#0e1626;border:0;font-weight:700;cursor:pointer;width:auto;padding:10px 18px}
button.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue)}
button.danger{background:transparent;color:var(--red);border:1px solid var(--red);padding:6px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 180px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{flex:0 0 auto;background:transparent;color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--blue);color:#0e1626;border-color:var(--blue)}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;display:none}
.msg.ok{display:block;background:rgba(76,210,122,.12);color:var(--green)}
.msg.err{display:block;background:rgba(255,107,122,.12);color:var(--red)}
.hide{display:none!important}
.user{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
</style>
</head>
<body>
<div class="box">
  <h1>بەڕێوەبردنی ڕێبەری پەروەردەی شارباژێڕ</h1>
  <p class="mut" id="who"></p>
  <div id="msg" class="msg"></div>

  <!-- first-time setup (only when no account exists yet) -->
  <section id="setup" class="hide">
    <h2>ڕێکخستنی سەرەتا</h2>
    <p class="mut">یەکجار بۆ دروستکردنی ئەکاونتی هۆبەی پلان. کلیلی دامەزراندن لە Netlify ـدایە.</p>
    <input id="sKey" type="password" placeholder="کلیلی دامەزراندن (SETUP_KEY)">
    <input id="sUser" placeholder="ناوی بەکارهێنەر (ئینگلیزی)">
    <input id="sPass" type="password" placeholder="وشەی نهێنی (لانیکەم ٨ پیت)">
    <button onclick="doSetup()">دروستکردنی ئەکاونت</button>
  </section>

  <!-- login -->
  <section id="login" class="hide">
    <h2>چوونەژوورەوە</h2>
    <input id="lUser" placeholder="ناوی بەکارهێنەر" autocomplete="username">
    <input id="lPass" type="password" placeholder="وشەی نهێنی" autocomplete="current-password">
    <button onclick="doLogin()">چوونەژوورەوە</button>
  </section>

  <!-- editor -->
  <section id="app" class="hide">
    <div class="row"><span id="meLine" class="mut"></span><button class="ghost" onclick="logout()">دەرچوون</button></div>
    <div class="tabs" id="tabs"></div>

    <div id="tab-unit">
      <h2>زانیاری هۆبە</h2>
      <select id="uSel" onchange="fillUnit()"></select>
      <input id="uDuties" placeholder="ئەرک و دەسەڵات">
      <input id="uRoom" placeholder="نهۆم و ژوور">
      <input id="uHours" placeholder="کاتی دەوام">
      <input id="uPhone" placeholder="تەلەفۆن" dir="ltr">
      <input id="uEmail" placeholder="ئیمەیڵ" dir="ltr">
      <button onclick="saveUnit()">پاشەکەوتکردن</button>
    </div>

    <div id="tab-users" class="hide">
      <h2>ئەکاونتەکانی هۆبەکان</h2>
      <div id="userList"></div>
      <h2>ئەکاونتی نوێ</h2>
      <div class="row">
        <input id="nUser" placeholder="ناوی بەکارهێنەر (ئینگلیزی)" dir="ltr">
        <select id="nUnit"></select>
        <input id="nPass" type="password" placeholder="وشەی نهێنی (٨ پیت)">
      </div>
      <button onclick="addUser()">زیادکردن</button>
    </div>

    <div id="tab-faq" class="hide">
      <h2>پرسیارە باوەکان</h2>
      <p class="mut">هەر پرسیارێک لە دێڕێکدا بە شێوەی «پرسیار | وەڵام» بنووسە.</p>
      <textarea id="faqText" style="min-height:220px"></textarea>
      <button onclick="saveFaq()">پاشەکەوتکردن</button>
    </div>
  </section>
</div>

<script>
const API = '/api';
let token = localStorage.getItem('rebari-token') || '', me = null, units = [], planUnit = '', guide = {units:{}, faq:[]};
const $ = id => document.getElementById(id);
const show = (id, on) => $(id).classList.toggle('hide', !on);
function msg(text, ok){ const m=$('msg'); m.textContent=text; m.className='msg '+(ok?'ok':'err'); setTimeout(()=>m.className='msg',4000); }
async function api(path, opts={}){
  const r = await fetch(API+path, {...opts, headers:{'content-type':'application/json', ...(token?{authorization:'Bearer '+token}:{}), ...(opts.headers||{})}});
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || 'هەڵە');
  return data;
}
async function boot(){
  const u = await api('/units'); units = u.units; planUnit = u.planUnit;
  guide = await api('/guide');
  if(token){
    try{ me = await api('/me'); return showApp(); }catch(e){ token=''; localStorage.removeItem('rebari-token'); }
  }
  show('login', true);
}
function showApp(){
  show('login', false); show('setup', false); show('app', true);
  $('meLine').textContent = `${me.username} · ${me.unit}`;
  const isPlan = me.role === 'plan';
  const tabs = [['unit','زانیاری هۆبە']].concat(isPlan ? [['users','ئەکاونتەکان'],['faq','پرسیارە باوەکان']] : []);
  $('tabs').innerHTML = tabs.map(([k,l],i)=>`<button data-t="${k}" class="${i?'':'on'}" onclick="tab('${k}')">${l}</button>`).join('');
  const sel = $('uSel');
  sel.innerHTML = units.filter(n => isPlan || n === me.unit).map(n=>`<option value="${n}">${n}</option>`).join('');
  sel.disabled = !isPlan;
  fillUnit();
  if(isPlan){ $('nUnit').innerHTML = units.filter(n=>n!==planUnit).map(n=>`<option value="${n}">${n}</option>`).join(''); loadUsers(); $('faqText').value = (guide.faq||[]).map(f=>`${f.q} | ${f.a}`).join('\n'); }
  $('who').textContent = isPlan ? 'هۆبەی پلان: دەسەڵاتی تەواو' : 'تەنها دەتوانیت زانیاری هۆبەی خۆت دەستکاری بکەیت';
  tab('unit');
}
function tab(k){
  ['unit','users','faq'].forEach(x=>{ const el=$('tab-'+x); if(el) show('tab-'+x, x===k); });
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===k));
}
function fillUnit(){
  const n = $('uSel').value || (me && me.unit); const u = (guide.units||{})[n] || {};
  $('uDuties').value=u.duties||''; $('uRoom').value=u.room||''; $('uHours').value=u.hours||''; $('uPhone').value=u.phone||''; $('uEmail').value=u.email||'';
}
async function doLogin(){
  try{ const r = await api('/login',{method:'POST',body:JSON.stringify({username:$('lUser').value,password:$('lPass').value})});
    token=r.token; localStorage.setItem('rebari-token',token); me={username:r.username,unit:r.unit,role:r.role}; showApp(); }
  catch(e){ msg(e.message,false); }
}
function logout(){ token=''; me=null; localStorage.removeItem('rebari-token'); location.reload(); }
async function doSetup(){
  try{ await api('/setup',{method:'POST',body:JSON.stringify({setupKey:$('sKey').value,username:$('sUser').value,password:$('sPass').value})});
    msg('ئەکاونت دروست بوو. ئێستا بچۆ ژوورەوە.',true); show('setup',false); show('login',true); }
  catch(e){ msg(e.message,false); }
}
async function saveUnit(){
  const n=$('uSel').value||me.unit;
  try{ const r = await api('/unit/'+encodeURIComponent(n),{method:'PUT',body:JSON.stringify({duties:$('uDuties').value,room:$('uRoom').value,hours:$('uHours').value,phone:$('uPhone').value,email:$('uEmail').value})});
    guide.units[n]=r.unit; msg('پاشەکەوت کرا',true); }
  catch(e){ msg(e.message,false); }
}
async function loadUsers(){
  try{ const r = await api('/users');
    $('userList').innerHTML = r.users.map(u=>`<div class="user"><span>${u.username} — ${u.unit}</span>${u.unit===planUnit?'':`<button class="danger" onclick="delUser('${u.username}')">سڕینەوە</button>`}</div>`).join('') || '<p class="mut">هیچ ئەکاونتێک نییە</p>';
  }catch(e){ msg(e.message,false); }
}
async function addUser(){
  try{ await api('/users',{method:'POST',body:JSON.stringify({username:$('nUser').value,unit:$('nUnit').value,password:$('nPass').value})});
    msg('ئەکاونت زیادکرا',true); $('nUser').value=''; $('nPass').value=''; loadUsers(); }
  catch(e){ msg(e.message,false); }
}
async function delUser(name){
  if(!confirm('ئەکاونتی '+name+' بسڕدرێتەوە؟')) return;
  try{ await api('/users/'+encodeURIComponent(name),{method:'DELETE'}); loadUsers(); }
  catch(e){ msg(e.message,false); }
}
async function saveFaq(){
  const faq = $('faqText').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [q,...a]=l.split('|');return {q:(q||'').trim(),a:a.join('|').trim()}}).filter(f=>f.q);
  try{ await api('/faq',{method:'PUT',body:JSON.stringify({faq})}); guide.faq=faq; msg('پرسیارەکان پاشەکەوت کران',true); }
  catch(e){ msg(e.message,false); }
}
(async()=>{
  try{
    const st = await api('/setup-status');
    if(st.needsSetup){ show('setup', true); return; }
    await boot();
  }catch(e){ msg('پەیوەندی بە سێرڤەر نەبوو: '+e.message,false); show('login',true); }
})();
</script>
</body>
</html>
